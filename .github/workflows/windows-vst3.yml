name: Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only superseded PR builds may be cancelled. Main-branch and manual builds
# remain protected so a release or owner-requested verification is not stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-vst3:
    name: DSP tests + Windows VST3
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract submitted Skell-Snap source
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'source-archive/skell-snap.zip'
          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Source archive is missing: $archive"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $PWD 'source') -Force
          $sourceRoot = Join-Path $PWD 'source/skell-snap'
          if (-not (Test-Path (Join-Path $sourceRoot 'CMakeLists.txt'))) {
            throw "The archive did not contain source/skell-snap/CMakeLists.txt"
          }
          "SKELL_SNAP_SOURCE=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch and test the extracted source program name
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/patch-skell-snap-program-name.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/patch-skell-snap-program-name.ps1 -SourceRoot $env:SKELL_SNAP_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test VST3 release verifier
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-vst3-bundle.ps1 -SelfTest

      - name: Configure portable DSP tests
        shell: pwsh
        run: |
          cmake -S "$env:SKELL_SNAP_SOURCE" -B build-core -DSNAP_BUILD_PLUGIN=OFF -DSNAP_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run portable DSP tests
        shell: pwsh
        run: |
          cmake --build build-core --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExe = Join-Path $PWD 'build-core/Release/SnapCoreTests.exe'
          if (-not (Test-Path $testExe)) {
            $testExe = Join-Path $PWD 'build-core/SnapCoreTests.exe'
          }
          if (-not (Test-Path $testExe)) { throw "SnapCoreTests.exe was not produced" }
          & $testExe --quick
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure JUCE VST3
        shell: pwsh
        run: |
          cmake -S "$env:SKELL_SNAP_SOURCE" -B build -DSNAP_BUILD_PLUGIN=ON -DSNAP_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Build the VST3 target explicitly; do not build JUCE's Standalone target.
      - name: Build Windows VST3 only
        shell: pwsh
        run: |
          cmake --build build --target SkellSnap_VST3 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify VST3 bundle, moduleinfo, class IDs and AMD64 PE
        shell: pwsh
        run: |
          $vst3Root = Join-Path $PWD 'build/SkellSnap_artefacts/Release/VST3'
          pwsh -NoProfile -File scripts/verify-vst3-bundle.ps1 -Vst3Root $vst3Root -ExpectedBundleName 'Skell-Snap.vst3' -CommitSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: build/SkellSnap_artefacts/Release/VST3/Skell-Snap.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3

      # Owner-requested public preview: this is the verified VST3 bundle,
      # not a draft release. Actions artifacts expire after the configured period.
      - name: Upload verified Windows x64 VST3
        uses: actions/upload-artifact@v6
        with:
          name: Skell-Snap-Windows-x64-VST3
          path: build/SkellSnap_artefacts/Release/VST3/Skell-Snap.vst3
          if-no-files-found: error
          retention-days: 30
