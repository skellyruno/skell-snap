name: Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only superseded PR builds may be cancelled. Main-branch and manual builds
# remain protected so release or owner-requested verification is not stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-vst3:
    name: DSP compatibility + Windows VST3
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reassemble and verify the source archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/reassemble-source-archive.ps1 -OutputPath (Join-Path $PWD 'source-archive/skell-snap-source.tar.gz')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extract submitted Skell-Snap source and restore shared assets
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'source-archive/skell-snap-source.tar.gz'
          $extractRoot = Join-Path $PWD 'source'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          tar -xzf $archive -C $extractRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceRoot = Join-Path $extractRoot 'skell-snap'
          if (-not (Test-Path (Join-Path $sourceRoot 'CMakeLists.txt'))) {
            throw "The archive did not contain source/skell-snap/CMakeLists.txt"
          }
          $assets = Join-Path $PWD 'Assets'
          if (-not (Test-Path (Join-Path $assets 'fonts/OFL-Montserrat.txt'))) {
            throw "The shared Skell asset bundle or Montserrat font licence is missing."
          }
          Copy-Item -LiteralPath $assets -Destination (Join-Path $sourceRoot 'Assets') -Recurse -Force
          if (-not (Test-Path (Join-Path $sourceRoot 'Assets/rune_atlas.png'))) {
            throw "The rune artwork was not restored into the extracted source."
          }
          "SKELL_SNAP_SOURCE=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply updated audio-reactive UI/source overlay
        shell: pwsh
        run: |
          $overlayRoot = Join-Path $PWD 'source-overlay'
          New-Item -ItemType Directory -Path $overlayRoot -Force | Out-Null
          tar -xzf (Join-Path $PWD 'source-overlay.tar.gz') -C $overlayRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path (Join-Path $overlayRoot 'Source/*') -Destination (Join-Path $env:SKELL_SNAP_SOURCE 'Source') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $overlayRoot 'CMakeLists.txt') -Destination (Join-Path $env:SKELL_SNAP_SOURCE 'CMakeLists.txt') -Force
          Copy-Item -Path (Join-Path $overlayRoot 'tests/*') -Destination (Join-Path $env:SKELL_SNAP_SOURCE 'tests') -Recurse -Force
          if (-not (Test-Path (Join-Path $env:SKELL_SNAP_SOURCE 'Source/ui/RetuneScale.h'))) {
            throw "The reversed Retune scale helper was not applied."
          }

      - name: Verify legacy latency values and append Zero safely
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/patch-skell-snap-latency-compat.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/patch-skell-snap-latency-compat.ps1 -SourceRoot $env:SKELL_SNAP_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Patch and test the extracted source program name
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/patch-skell-snap-program-name.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/patch-skell-snap-program-name.ps1 -SourceRoot $env:SKELL_SNAP_SOURCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test VST3 release verifier
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-vst3-bundle.ps1 -SelfTest

      - name: Configure portable DSP and UI regression tests
        shell: pwsh
        run: |
          cmake -S "$env:SKELL_SNAP_SOURCE" -B build-core -DSNAP_BUILD_PLUGIN=OFF -DSNAP_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run all portable tests (including Classic bit parity)
        shell: pwsh
        run: |
          cmake --build build-core --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-core -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure JUCE VST3
        shell: pwsh
        run: |
          cmake -S "$env:SKELL_SNAP_SOURCE" -B build -DSNAP_BUILD_PLUGIN=ON -DSNAP_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Build the VST3 target explicitly; do not build JUCE's Standalone target.
      - name: Build Windows x64 VST3 only
        shell: pwsh
        run: |
          cmake --build build --target SkellSnap_VST3 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify VST3 bundle, moduleinfo, class IDs and AMD64 PE
        shell: pwsh
        run: |
          $vst3Root = Join-Path $PWD 'build/SkellSnap_artefacts/Release/VST3'
          pwsh -NoProfile -File scripts/verify-vst3-bundle.ps1 -Vst3Root $vst3Root -ExpectedBundleName 'Skell-Snap.vst3' -CommitSha $env:GITHUB_SHA -SourceArchivePath 'source-archive/skell-snap-source.tar.gz' -SourceOverlayPath 'source-overlay.tar.gz'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: build/SkellSnap_artefacts/Release/VST3/Skell-Snap.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3

      - name: Create and inspect install-ready Windows ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vst3Root = Join-Path $PWD 'build/SkellSnap_artefacts/Release/VST3'
          $bundle = Join-Path $vst3Root 'Skell-Snap.vst3'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "The built VST3 bundle is missing: $bundle"
          }

          $stage = Join-Path $env:RUNNER_TEMP 'Skell-Snap-Windows-Installer'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $stage -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $PWD 'Install-Skell-Snap.bat') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $PWD 'README-INSTALL.txt') -Destination $stage

          $zipPath = Join-Path $PWD 'Skell-Snap-Windows-Installer.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stage,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )

          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
          }
          finally { $zip.Dispose() }

          $requiredEntries = @(
            'Skell-Snap.vst3/Contents/Resources/moduleinfo.json',
            'Skell-Snap.vst3/Contents/x86_64-win/Skell-Snap.vst3',
            'Install-Skell-Snap.bat',
            'README-INSTALL.txt'
          )
          foreach ($entry in $requiredEntries) {
            if ($entries -notcontains $entry) {
              throw "Installer ZIP is malformed; required entry is missing: $entry"
            }
          }
          if ($entries.Count -lt 6) {
            throw "Installer ZIP appears incomplete; found only $($entries.Count) entries."
          }
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Verified installer ZIP: $zipPath ($((Get-Item $zipPath).Length) bytes), SHA-256 $zipHash"

      - name: Upload verified Windows x64 VST3 bundle
        uses: actions/upload-artifact@v6
        with:
          name: Skell-Snap-Windows-x64-VST3
          path: build/SkellSnap_artefacts/Release/VST3/Skell-Snap.vst3
          if-no-files-found: error
          retention-days: 30

      - name: Upload install-ready Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Skell-Snap-Windows-Installer
          path: Skell-Snap-Windows-Installer.zip
          if-no-files-found: error
          retention-days: 30
